{% extends 'base.html' %}
{% set active_page = 'labtests' %}

{% block title %}Add New Lab Test - City General Hospital{% endblock %}

{% block header_title %}
<h2>Add New Lab Test</h2>
<div class="user-info">
    <span>{{ session['username'] }}</span>
</div>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h3>Test Information</h3>

        <form method="POST">
            <div class="form-group">
                <label for="test_name">Test Name *</label>
                <input type="text" id="test_name" name="test_name" required>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="Blood">Blood</option>
                    <option value="Urine">Urine</option>
                    <option value="X-Ray">X-Ray</option>
                    <option value="CT Scan">CT Scan</option>
                    <option value="MRI">MRI</option>
                    <option value="Ultrasound">Ultrasound</option>
                    <option value="ECG">ECG</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="number" id="price" name="price" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="unit">Unit</label>
                    <input type="text" id="unit" name="unit" placeholder="e.g., mg/dL, ml">
                </div>
            </div>

            <div class="form-group">
                <label for="normal_range">Normal Range</label>
                <input type="text" id="normal_range" name="normal_range" placeholder="e.g., 70-100 mg/dL">
            </div>

            <div class="form-group">
                <label for="reporting_time">Reporting Time</label>
                <input type="text" id="reporting_time" name="reporting_time" placeholder="e.g., 24 hours, 2-3 days">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Describe the test..."></textarea>
            </div>

            <div class="form-group">
                <label for="instructions">Patient Instructions</label>
                <textarea id="instructions" name="instructions" rows="3" placeholder="e.g., Fasting required, No alcohol..."></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_active" value="1" checked> Active
                </label>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">Save Test</button>
                <a href="{{ url_for('labtest') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
