{% extends 'base.html' %}
{% set active_page = 'lab_requests' %}

{% block title %}New Lab Request - City General Hospital{% endblock %}

{% block header_title %}
<h2>New Lab Request</h2>
<div class="user-info">
    <span>{{ session['username'] }}</span>
</div>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h3>Lab Test Request</h3>

        <form method="POST">
            <div class="form-group">
                <label for="patient_id">Patient *</label>
                <select id="patient_id" name="patient_id" required>
                    <option value="">Select Patient</option>
                    {% for patient in patients %}
                    <option value="{{ patient.patient_id }}">
                        {{ patient.first_name }} {{ patient.last_name }} ({{ patient.mr_number }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="doctor_id">Referring Doctor *</label>
                <select id="doctor_id" name="doctor_id" required>
                    <option value="">Select Doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.doctor_id }}">
                        Dr. {{ doctor.first_name }} {{ doctor.last_name }} - {{ doctor.specialization }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="test_id">Lab Test *</label>
                <select id="test_id" name="test_id" required>
                    <option value="">Select Test</option>
                    {% for test in tests %}
                    <option value="{{ test.test_id }}">
                        {{ test.test_name }} ({{ test.category }}) - Rs. {{ test.price }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority *</label>
                <select id="priority" name="priority" required>
                    <option value="Routine" selected>Routine</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Emergency">Emergency</option>
                </select>
            </div>

            <div class="form-group">
                <label for="appointment_id">Appointment ID (Optional)</label>
                <input type="number" id="appointment_id" name="appointment_id" placeholder="Link to appointment if any">
            </div>

            <div class="form-group">
                <label for="clinical_notes">Clinical Notes</label>
                <textarea id="clinical_notes" name="clinical_notes" rows="4" placeholder="Enter any clinical notes or special instructions..."></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">Create Request</button>
                <a href="{{ url_for('lab_requests') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
