{% extends 'base.html' %}
{% set active_page = 'doctors' %}

{% block title %}Add New Doctor - City General Hospital{% endblock %}

{% block header_title %}
<h2>Add New Doctor</h2>
<div class="user-info">
    <span>{{ session['username'] }}</span>
</div>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h3>Doctor Information</h3>

        <form method="POST" action="{{ url_for('add_doctor') }}">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" name="first_name" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" name="last_name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Specialization *</label>
                    <input type="text" name="specialization" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select name="department_id">
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Qualification *</label>
                <input type="text" name="qualification" placeholder="e.g., MBBS, MD, MS" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" name="experience_years" min="0" step="1">
                </div>
                <div class="form-group">
                    <label>Consultation Fee</label>
                    <input type="number" name="consultation_fee" min="0" step="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>
            </div>

            <div class="form-group">
                <label>Available Days</label>
                <input type="text" name="available_days" placeholder="e.g., Mon, Tue, Wed, Thu, Fri">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Available Time Start</label>
                    <input type="time" name="available_time_start">
                </div>
                <div class="form-group">
                    <label>Available Time End</label>
                    <input type="time" name="available_time_end">
                </div>
            </div>

            <div class="form-group">
                <label>Bio / About</label>
                <textarea name="bio" rows="4" placeholder="Doctor's biography, achievements, etc..."></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary">Add Doctor</button>
                <a href="{{ url_for('doctors') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
